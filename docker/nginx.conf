# The nginx inside the site's image, serving a brand's build.
#
# Only the site lives here: any path that is not a file falls back to `index.html`, because the
# Angular routes belong to the browser and the server knows none of them.
#
# The house install (`deploy/subiu/nginx.conf` in the backend-gateway repo) mounts a configuration
# over this one that is this plus the `/backoffice`, `/gateway`, `/play` and `/admin` proxies, so
# the site, the CMS and the backend share one origin. While that one is mounted this file is not
# read; it is the default for whoever runs the site on its own.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular bundle is large and compresses very well; the CPU cost disappears next to what
    # stays off the wire.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Build output carries a hash in the file name: what a name means never changes, so the
    # browser may keep it forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The index has no hash, and it is the file that points at the ones that do. Caching it means
    # serving the previous version of the site after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 25M;
    sendfile on;
}
