server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Substitua pelo seu domínio se necessário, ou deixe _ para aceitar qualquer um
    server_name _;

    root /var/www/html;
    index index.html index.htm;

    # Configuração principal para o Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para arquivos estáticos (imagens, css, js)
    location ~* \.(?:css|js|ico|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # PROXY: API Principal
    location /api/ {
        proxy_pass https://pgapi.betaki.bet.br/;
        
        proxy_set_header Host pgapi.betaki.bet.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header Authorization $http_authorization;

        # SSL
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # PROXY: Backoffice (Correção para erro de Mixed Content)
    # O frontend deve chamar /backoffice/api/... em vez de http://3.18.69.221:8080/api/...
    location /backoffice/ {
        # Note a barra no final do proxy_pass para remover o /backoffice/ da url de destino se necessário
        # Assumindo que o backoffice espera receber /api/...
        proxy_pass http://3.18.69.221:8080/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
