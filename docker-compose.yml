version: '3.8'

services:
  angular-builder:
    build:
      context: .
      dockerfile: Dockerfile.build.dev
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .git/
            - dist/

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dist/website-angular/browser:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - angular-builder
