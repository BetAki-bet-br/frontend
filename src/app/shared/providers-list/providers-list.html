<app-game-list title="Todos os provedores" [categoryId]="categoryId()" [isExpanded]="true" [gameCount]="providers().length"
  [listTypeLabel]="'provedores'">
  <div class="w-full">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 p-3">
      @for (provider of providers(); track provider.id) {
      <div class="provider-tile bg-[#E0E0E0] rounded-lg shadow-lg flex items-center justify-center p-3">
        <a [routerLink]="['/games/provider', provider.id]"
          class="flex items-center p-0 z-10 transition-transform duration-300 hover:scale-105">
          <img [src]="providerImageUrl(provider.name)" draggable="false" [alt]="provider.name"
            class="h-12 sm:h-16 object-contain" />
        </a>
      </div>
      }
    </div>
  </div>
</app-game-list>
