<app-modal
  [customClass]="'md:h-1/2 xl:h-1/2 2xl:w-1/4!'"
  [showCloseButton]="false"
  [isOpen]="isOpen()"
  [size]="'sm'"
>
  <div class="text-center flex flex-col items-center justify-center w-full h-full">
    <img class="mx-auto mb-4 h-24 w-auto" src="assets/brand/logo-green.svg" alt="Betaki Logo" />
    <h2 class="mb-4 text-2xl font-bold text-black">Você tem mais de 18 anos?</h2>
    <p class="mb-6 text-gray-600">Para acessar nosso site, você deve ter 18 anos ou mais.</p>
    <div class="flex justify-center gap-x-4">
      <button
        (click)="confirm(true)"
        class="flex w-30 cursor-pointer justify-center gap-x-2 rounded-xl bg-betaki-500 p-2 text-base font-bold text-white transition-opacity duration-200 ease-in-out hover:opacity-80 sm:p-4"
        type="button"
      >
        Sim
      </button>
      <button
        (click)="confirm(false)"
        class="flex w-30 cursor-pointer items-center justify-center rounded-lg border-2 border-betaki-500 px-3 py-2 text-base font-bold text-betaki-500 transition-colors hover:bg-betaki-500 hover:text-white sm:text-sm"
        type="button"
      >
        Não
      </button>
    </div>
  </div>
</app-modal>
