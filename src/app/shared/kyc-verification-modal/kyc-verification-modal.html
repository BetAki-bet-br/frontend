<app-modal [isOpen]="isOpen()" (closeModal)="onClose()" size="sm" customClass="bg-[#3C3B3B]!">
  @if (iframeUrl()) {
  <iframe [src]="iframeUrl()" class="w-full h-full border-0"></iframe>
  } @else {
  <div class="flex flex-col items-center justify-center h-full text-center">
    <h2 class="text-xl font-bold text-black">Error</h2>
    <p class="mt-2 text-gray-600">
      Não foi possível carregar o processo de verificação. Por favor, tente novamente mais tarde.
    </p>
  </div>
  }
</app-modal>
