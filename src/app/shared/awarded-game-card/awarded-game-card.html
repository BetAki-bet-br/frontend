<div
  class="shrink-0 h-48 w-32 sm:w-[150px] sm:h-56 lg:h-[280px] lg:w-[165px] aspect-[3/4] rounded-lg  {{
    class()
  }}"
>
  <div
    class="relative flex flex-col h-full w-full overflow-hidden rounded-lg shadow-lg bg-shark-900 group cursor-pointer hover:shadow-xl bg-gradient-awarded p-[5px]"
  >
    <div class="relative flex-grow">
      <div class="absolute inset-0 rounded-lg awarded-gradient">
        <img
          [src]="gameImageUrl"
          [alt]="game().name"
          draggable="false"
          width="420"
          height="560"
          class="w-full h-full awarded-img object-cover rounded-lg"
        />
      </div>

      <div class="absolute top-1 right-1 z-10">
        <span
          class="inline-flex items-center rounded-full text-md sm:text-2xl font-medium bg-[#FFF] border-2 border-[#F64E3B] text-shark-50/80 backdrop-blur-sm"
        >
          🔥
        </span>
      </div>
      <!-- <div class="absolute bottom-1 left-0 right-0 ms-1 py-0 z-10 text-white">
        <h3 class="text-white font-bold md:text-xl line-clamp-2 text-nowrap font-bold">
          {{ game().name }}
        </h3>
      </div> -->
    </div>

    <div
      class="flex flex-col text-md text-white pt-1 from-betaki-500 text-xs font-alt text-nowrap to-black"
    >
      <p class="text-[#B0B4B6]">Já pagou</p>
      <span class="pt-1 md:text-base font-bold">{{ randomPrize() }}</span>
    </div>
  </div>
</div>
