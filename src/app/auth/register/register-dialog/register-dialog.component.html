<app-base-dialog [displayCloseButton]="true" [height]="dialogHeight" title="">
  <!-- Title -->
  <div dialogContent>
    <div class="login-header-text mb-26" translate [class.hidden]="isStepTwo">
      Register at <span>{{ brandName }}</span>
    </div>
    <!-- Content -->
    <div class="form-container" [class.full-height]="isStepTwo">
      <mat-stepper class="sign-up-stepper" orientation="horizontal" [linear]="true" #stepper>
        <mat-step
          [stepControl]="registerForm"
          [editable]="!preRegistrationCompleted"
          [completed]="preRegistrationCompleted"
        >
          <!-- Personal data step -->
          <ng-template matStepContent>
            <app-personal-data
              (emitPersonalData)="onPersonalDataComplete($event)"
              [registerForm]="registerForm"
              [registerError]="registerError"
              [countriesCode]="countriesCode"
            ></app-personal-data>
            <!-- Sign in -->
            <div class="flex-row flex-wrap justify-center items-baseline gap-4 mt-8">
              <div class="info-text" translate>Already have an account?</div>
              <a class="link" (click)="onClose({ closeEvent: 'signIn' })" translate>Sign In now</a>
            </div>
          </ng-template>
        </mat-step>
        <mat-step [stepControl]="onboardingForm" [editable]="!onboardingCompleted" [completed]="onboardingCompleted">
          <!-- CAF onboarding wizard -->
          <ng-template matStepContent>
            <app-caf-onboarding
              *ngIf="onboardingUrl"
              [onboardingUrl]="onboardingUrl"
              (onboardingFinished)="onOnboardingFinished($event)"
            ></app-caf-onboarding>
          </ng-template>
        </mat-step>
        <mat-step>
          <ng-template matStepContent>
            <div class="flex-col gap-10">
              <app-caf-onboarding-completed></app-caf-onboarding-completed>

              <!-- Close button -->
              <div class="flex-row flex-wrap justify-center items-baseline gap-4">
                <button
                  mat-button
                  class="button-text-small label-dark flex-grow"
                  (click)="onClose({ closeEvent: 'closeDialog' })"
                >
                  <span class="register-button-text mr-8" translate>Close</span>
                </button>
              </div>
            </div>
          </ng-template>
        </mat-step>
      </mat-stepper>
    </div>
  </div>
</app-base-dialog>
