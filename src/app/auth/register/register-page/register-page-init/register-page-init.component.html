<div class="flex flex-col gap-8 items-center justify-center">
  <div class="banner-container">
    <div [innerHTML]="bannerItem?.templateHtml"></div>
  </div>
  <div class="register-container flex flex-col gap-8 items-center justify-center">
    <div class="register-content flex flex-col items-center jusitfy-center gap-8">
      <span class="title" translate>Welcome to Betaki</span>
      <span class="subtitle" translate
        >Sign up using one of the accounts below and enjoy the best betting experience with Betaki.</span
      >
      <button mat-button class="register-button" (click)="registerClick.emit()">
        <mat-icon fontSet="material-icons-outlined"> account_circle </mat-icon>
        <span translate>Register with e-mail</span>
      </button>
    </div>

    <div class="flex width-full items-center justify-center gap-4">
      <span class="login-span" translate>Already have an account?</span>
      <button mat-stroked-button class="login-button" routerLink="/sign-in">{{ 'Enter' | translate }}</button>
    </div>
  </div>
</div>
