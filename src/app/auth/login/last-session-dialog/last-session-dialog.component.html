<app-base-dialog class="last-session-base-dialog" [displayTopBar]="true" [title]="'Logged in' | translate">
  <p dialogContent *ngIf="lastLoginTime">
    {{ 'Your last session was:' | translate }} {{ lastLoginTime | date: dateFormat }}
  </p>
  <p dialogContent *ngIf="!lastLoginTime">
    {{ 'This is your first session, started at:' | translate }} {{ currentDate | date: dateFormat }}
  </p>

  <ng-container dialogButtons>
    <button mat-button class="button-text-small label-dark flex-grow" (click)="onClose()">
      {{ 'Close' | translate }}
    </button>
  </ng-container>
</app-base-dialog>
