<app-base-dialog width="35rem" customClass="confirmation-dialog" [title]="'Are you over 18 years old?' | translate">
  <p dialogContent *ngIf="isUnderage">
    {{ 'The site is intended for people over 18 years of age.' | translate }}
  </p>

  <ng-container dialogButtons *ngIf="!isUnderage">
    <button mat-stroked-button class="button-text-small label-dark flex-grow" (click)="onCancel()">
      <mat-icon fontSet="material-icons-outlined">cancel</mat-icon>
      <span translate>No</span>
    </button>
    <button mat-button class="button-text-small label-dark flex-grow" (click)="onConfirm()">
      <mat-icon fontSet="material-icons-outlined">check_circle</mat-icon>
      <span translate>Yes</span>
    </button>
  </ng-container>
</app-base-dialog>
