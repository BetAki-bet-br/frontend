<app-base-dialog
  [fullscreenMobile]="false"
  customClass="w-[90vw]! max-w-[486px]! h-fit!"
  [title]="'Are you over 18 years old?' | translate"
>
  <ng-container dialogButtons>
    <div class="flex w-full justify-end gap-4">
      <app-button class="flex-grow" variant="outline" fullWidth (click)="onCancel()">
        <mat-icon fontSet="material-icons-outlined">cancel</mat-icon>
        <span translate>No</span>
      </app-button>
      <app-button class="flex-grow" variant="primary" fullWidth (click)="onConfirm()">
        <mat-icon fontSet="material-icons-outlined">check_circle</mat-icon>
        <span translate>Yes</span>
      </app-button>
    </div>
  </ng-container>
</app-base-dialog>
