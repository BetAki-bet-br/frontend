<form [formGroup]="resendConfirmationInstructionsForm" class="flex-col form-container">
  <h1>{{ 'Resend Confirmation Instructions' | translate }}</h1>
  <div class="flex-col mb-24">
    <mat-form-field class="form-input" subscriptSizing="dynamic">
      <input matInput placeholder="Enter your email" formControlName="email" autocomplete="off" />
      <mat-error class="error-msg" *ngIf="resendConfirmationInstructionsForm.get('email')?.errors">
        {{ "can't be blank" | translate }}
      </mat-error>
    </mat-form-field>
  </div>

  <div class="flex-col">
    <button
      mat-button
      type="submit"
      class="button-larger-text confirm-button flex-row"
      (click)="resendConfirmationInstructions()"
    >
      <span class="confirm-button-text mr-8" translate>{{
        'Resend confirmation instructions' | translate | uppercase
      }}</span>
      <app-loader class="loader" [isLoading]="isDataLoading" [size]="0.5"></app-loader>
    </button>
  </div>

  <!-- <div class="link-container flex-col items-center gap-8 mt-44">
    <a class="link" routerLink="/users/unlock/new" translate>Didn't receive unlock instructions?</a>
    <a class="link" routerLink="/users/password/new" translate>Forgot Your Password?</a>
  </div> -->
</form>
