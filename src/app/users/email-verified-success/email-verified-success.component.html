<div class="player-profile-page-container flex flex-col items-center">
  <div class="page-section flex-col gap-32 items-center">
    <img class="success-img" alt="check" [src]="'assets/general/icons/success-check.svg' | cdnize" />
    <div class="title" translate>E-mail successfully verified</div>
    <div class="subtitle" translate>You can now access all the features of your account. Welcome and good luck.</div>
  </div>

  <!-- SUPPORT AND INFO -->
  <div class="flex-col items-center">
    <img class="age-icon" [src]="'assets/general/icons/18-plus.svg' | cdnize" />
    <span translate class="policy-span mt-8">
      <b>Jogue com Responsabilidade</b> <br />
      O jogo deve ser uma forma de entretenimento saudável.<br />
      Pratique sempre o jogo consciente e fique atento aos sinais de comportamento compulsivo.
    </span>
  </div>

  <button class="live-chat-button" mat-button (click)="onChatClick()">
    <div class="flex-row items-center gap-10">
      <mat-icon svgIcon="help-chat-icon"></mat-icon>
      <span translate> Do you need help? </span>
    </div>
  </button>
</div>
