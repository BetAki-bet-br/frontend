<div class="bonuses-container">
  <div class="bonuses-wrapper">
    @for (banner of bannerList; track banner) {
      <div class="bonus-item" [innerHTML]="banner.templateHtml"></div>
    } @empty {
      @for (skeleton of skeletons; track $index) {
        <div
          class="bonus-item flex flex-col rounded-[1.5rem] border border-shark-400 h-[30.875rem] overflow-hidden animate-pulse"
        >
          <!-- Image placeholder -->
          <div class="h-1/2 w-full bg-shark-600/50"></div>

          <!-- Content container -->
          <div class="flex flex-col flex-1 p-6 gap-4">
            <!-- Tags -->
            <div class="flex gap-2">
              <div class="h-6 w-24 bg-shark-400 rounded-full"></div>
              <div class="h-6 w-32 bg-shark-400 rounded-full"></div>
            </div>

            <!-- Title -->
            <div class="mt-2 h-8 w-3/4 bg-shark-400 rounded-lg"></div>

            <!-- Description -->
            <div class="space-y-2">
              <div class="h-4 w-full bg-shark-400 rounded"></div>
              <div class="h-4 w-5/6 bg-shark-400 rounded"></div>
            </div>

            <!-- Button (at bottom) -->
            <div class="mt-auto pt-4">
              <div class="h-12 w-full bg-shark-400 rounded-xl"></div>
            </div>
          </div>
        </div>
      }
    }
  </div>
</div>
