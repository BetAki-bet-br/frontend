<app-base-dialog
  [title]="'Account Closure' | translate"
  [customClass]="'md:h-75! lg:w-1/4!'"
  [displayCloseButton]="true"
>
  <p dialogContent>
    {{ 'Are you sure you want to close your account? This action is permanent and cannot be undone.' | translate }}
  </p>

  <ng-container dialogButtons>
    <div class="flex gap-4">
      <app-button class="flex-grow" variant="outline" fullWidth (click)="cancel()">
        <span translate>Cancel</span>
      </app-button>

      <app-button class="flex-grow" variant="primary" fullWidth (click)="confirm()">
        <span translate>Close Account</span>
      </app-button>
    </div>
  </ng-container>
</app-base-dialog>
