<div translate class="no-records-text" *ngIf="!tableData || tableData.length === 0">
  {{ noRecordsText }}
</div>

<table
  mat-table
  [dataSource]="dataSource"
  matSort
  *ngIf="tableData && tableData.length > 0"
  [multiTemplateDataRows]="EnableExpandableRows"
>
  <ng-container *ngFor="let column of tableColumns" [matColumnDef]="column.name">
    <th
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header="{{ column.sortingField }}"
      ngClass="{{ column.customClass }}"
      [disabled]="DisableSort"
    >
      {{ column.name }}
    </th>
    <td mat-cell *matCellDef="let element" ngClass="{{ column.customClass }}">
      <ng-container *ngIf="!column.columnTemplate"
        ><div class="table-cell-content" ngClass="{{ column.customClass }}">
          {{ element[column.dataField] }}
        </div>
      </ng-container>
      <ng-container *ngIf="column.columnTemplate">
        <div class="table-cell-content" ngClass="{{ column.customClass }}">
          <ng-template
            [ngTemplateOutlet]="column.columnTemplate"
            [ngTemplateOutletContext]="{
              data: element[column.dataField],
              rowData: element,
              columnName: column.name
            }"
          ></ng-template>
        </div>
      </ng-container>
    </td>
  </ng-container>

  <ng-container *ngIf="EnableExpandableRows">
    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
      <td mat-cell *matCellDef="let element">
        <div
          matRipple
          class="ripple-container"
          aria-label="expand row"
          (click)="expandElement(element); $event.stopPropagation()"
        >
          <mat-icon *ngIf="!element.isExpanded">keyboard_arrow_down</mat-icon>
          <mat-icon *ngIf="element.isExpanded">keyboard_arrow_up</mat-icon>
        </div>
      </td>
    </ng-container>

    <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
        <div class="expanded-detail-container" [@detailExpand]="element.isExpanded ? 'expanded' : 'collapsed'">
          <ng-container *ngIf="ExpandableRowTemplate">
            <div>
              <ng-template
                [ngTemplateOutlet]="ExpandableRowTemplate"
                [ngTemplateOutletContext]="{
                  data: element,
                  rowData: element
                }"
              ></ng-template>
            </div>
          </ng-container>
        </div>
      </td>
    </ng-container>
  </ng-container>

  <ng-container *ngIf="!HideHeader"
    ><tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr
  ></ng-container>
  <tr
    mat-row
    *matRowDef="let row; columns: columnsToDisplayWithExpand"
    class="expanded-row"
    [class.expanded-row]="row.isExpanded"
    (click)="expandElement(row)"
  ></tr>

  <ng-container *ngIf="EnableExpandableRows">
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
  </ng-container>
</table>

<mat-paginator
  [ngClass]="!paginatorVisibility ? 'hide-paginator' : ''"
  aria-label="Select page"
  [hidePageSize]="true"
  [pageSize]="pageSize"
  *ngIf="displayPaginator"
>
</mat-paginator>
