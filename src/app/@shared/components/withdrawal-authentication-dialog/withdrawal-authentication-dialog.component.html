<app-base-dialog width="29rem" [title]="data.title" [displayCloseButton]="true">
  <div dialogContent>
    <ng-container>
      <div class="description mb-32">{{ data.description }}</div>
    </ng-container>
  </div>

  <ng-container dialogButtons>
    <button mat-stroked-button class="button-text-small label-dark" (click)="cancel()">
      {{ 'Cancel' | translate }}
    </button>
    <button mat-button class="button-text-small label-dark" (click)="confirm()">
      {{ 'Authenticate' | translate }}
    </button>
  </ng-container>
</app-base-dialog>
