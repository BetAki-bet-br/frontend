<app-base-dialog [title]="data.title | translate">
  <p class="text-center" dialogContent>{{ data.message | translate }}</p>
  <ng-container dialogButtons>
    <div class="flex gap-4">
      <app-button class="flex-grow" variant="outline" fullWidth (click)="cancel()">
        {{ data.cancelButtonText ?? 'No' | translate }}
      </app-button>
      <app-button class="flex-grow" variant="primary" fullWidth (click)="confirm()">
        {{ data.confirmButtonText ?? 'Yes' | translate }}
      </app-button>
    </div>
  </ng-container>
</app-base-dialog>
