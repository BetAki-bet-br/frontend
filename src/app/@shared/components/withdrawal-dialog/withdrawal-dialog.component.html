<app-base-dialog width="29rem" [displayCloseButton]="true" [displayLogo]="false">
  <div dialogContent>
    <div class="header-icon">
      <mat-icon *ngIf="data.success" class="status-img" alt="check" svgIcon="success-check"></mat-icon>
      <mat-icon *ngIf="!data.success" class="status-img" alt="fail" svgIcon="fail"></mat-icon>
    </div>

    <div class="header-text">
      {{ data.title }}
    </div>

    <ng-container *ngIf="data">
      <div class="description mb-32">{{ data.description }}</div>
    </ng-container>
  </div>

  <ng-container dialogButtons>
    <div *ngIf="data.success || data.withdrawalDisabled" class="button-container flex-col gap-16">
      <button mat-button class="button-text-small label-dark" (click)="toSportsbook()">
        {{ 'To Esports' | translate }}
      </button>
      <button mat-stroked-button class="button-text-small label-dark" (click)="toGames()">
        {{ 'To Casino' | translate }}
      </button>
    </div>

    <div *ngIf="!data.success && !data.withdrawalDisabled" class="button-container flex-col gap-16">
      <button mat-button class="button-text-small label-dark" (click)="confirm()">
        {{ 'Make a new withdrawal' | translate }}
      </button>
      <button mat-stroked-button class="button-text-small label-dark" (click)="toProfile()">
        {{ 'Cancel' | translate }}
      </button>
    </div>
  </ng-container>
</app-base-dialog>
