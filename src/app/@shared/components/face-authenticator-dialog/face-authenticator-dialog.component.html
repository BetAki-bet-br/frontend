<app-base-dialog
  width="40.375rem"
  height="100%"
  [displayTopBar]="false"
  [displayCloseButton]="false"
  customClass="bg-[#3C3B3B]!"
>
  <div dialogContent class="iframe-container">
    @if (safeUrl) {
    <iframe
      [src]="safeUrl"
      frameborder="0"
      allow="geolocation;camera;fullscreen;accelerometer;gyroscope;magnetometer;"
    ></iframe>
    } @if (isLoading) {
    <mat-spinner />
    }
  </div>
</app-base-dialog>
