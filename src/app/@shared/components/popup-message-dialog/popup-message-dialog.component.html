<app-base-dialog
  width="29rem"
  [title]="data.title ?? ''"
  [displayCloseButton]="!!data.showCloseButton && isMobile"
  [customButtonClass]="'mt-auto'"
>
  <div dialogContent>
    @if (data) {
      <div class="mb-8 flex flex-col text-center" [innerHTML]="sanitizedContent"></div>
    }
  </div>

  <ng-container dialogButtons>
    <div class="flex gap-4">
      @for (action of data.actions; track action) {
        <app-button variant="neutral" (click)="confirm(action.id ?? null)">
          <span translate>{{ action.name }}</span>
        </app-button>
      }
    </div>
  </ng-container>
</app-base-dialog>
