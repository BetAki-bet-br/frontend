<app-base-dialog
  width="29rem"
  [title]="data.title ?? ''"
  [customClass]="'md:h-1/2 xl:h-1/2 2xl:w-1/4!'"
  [displayCloseButton]="!!data.showCloseButton && isMobile"
>
  <div dialogContent>
    @if (data) {
    <div class="mb-8" [innerHTML]="sanitizedContent"></div>
    }
  </div>

  <ng-container dialogButtons>
    @for (action of data.actions; track action) {
    <button mat-button class="button-text-small label-dark flex-grow" (click)="confirm(action.id ?? null)">
      <span translate>{{ action.name }}</span>
    </button>
    }
  </ng-container>
</app-base-dialog>
