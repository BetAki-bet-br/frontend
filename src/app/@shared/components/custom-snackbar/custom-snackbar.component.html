<div class="custom-snackbar-content">
  <div class="close-icon-container"><mat-icon (click)="close()">close</mat-icon></div>
  <div class="flex items-center gap-1">
    @if (data.type === 'error') {
    <div class="snackbar-icon"><mat-icon class="warning-icon">warning</mat-icon></div>
    } @if (data.type === 'success') {
    <div class="snackbar-icon">
      <mat-icon class="success-icon" svgIcon="check" />
    </div>
    }
    <div class="message">{{ data.message }}</div>
  </div>
</div>
