<div class="custom-snackbar-content">
  <div class="close-icon-container"><mat-icon (click)="close()">close</mat-icon></div>
  <div class="flex-row items-center gap-4">
    <div *ngIf="data.type === 'error'" class="snackbar-icon"><mat-icon class="warning-icon">warning</mat-icon></div>
    <div *ngIf="data.type === 'success'" class="snackbar-icon">
      <mat-icon class="success-icon" svgIcon="check"></mat-icon>
    </div>
    <div class="message">{{ data.message }}</div>
  </div>
</div>
