<div
  class="category-card flex flex-col"
  [style]="{
    'background-image': 'url(' + (!isMobile ? cardData.backgroundImg : cardData.backgroundMobileImg) + ')'
  }"
>
  <div class="flex description">&nbsp;</div>
  <div class="flex action-contaniner">
    <a mat-button translate [routerLink]="cardData.buttonUrl">
      {{ cardData.buttonText }}
    </a>
  </div>
</div>
