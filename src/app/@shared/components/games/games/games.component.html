<ng-container *ngIf="!gameCatalog">
  <div
    #gameGridContainer
    class="game-grid-container"
    [class.hide-autogenerated-rows]="hideAutogeneratedRows"
    [ngStyle]="{ 'grid-template-rows': gridTemplateRows }"
  >
    <app-game-card
      *ngFor="let game of gamesDisplayed; let indexOfElement = index"
      [game]="game"
      [indexOfElement]="indexOfElement"
    ></app-game-card>
  </div>
  <div class="load-more" *ngIf="!endOfGames || hasHiddenRows">
    <button mat-button class="show-more-button secondary" (click)="loadMore()" translate>
      <span translate>show more</span>
    </button>
  </div>
</ng-container>

<ng-container *ngIf="gameCatalog">
  <div class="games-swiper-top-bar">
    <div class="label-wrapper">
      <span class="label">{{ gameCatalogTranslated }}</span>
      <mat-icon class="game-category-icon" [svgIcon]="gameCatalogCleanName"></mat-icon>
    </div>

    <div class="games-swiper-navigation">
      <a class="view-all" [routerLink]="[isLive ? '/games-live' : '/games', gameCatalogCleanName]">{{
        'View all' | translate
      }}</a>
      <mat-icon class="games-swiper-navigation-left-{{ categoryId }}">chevron_left</mat-icon>
      <mat-icon class="games-swiper-navigation-right-{{ categoryId }}">chevron_right</mat-icon>
    </div>
  </div>
  <div class="swiper-wrapper">
    <!-- <div class="games-swiper-navigation-left-{{ categoryId }} mobile-navigation">
      <mat-icon>chevron_left</mat-icon>
    </div> -->
    <swiper [config]="swiperConfig">
      <ng-container *ngFor="let game of gamesDisplayed; let indexOfElement = index">
        <ng-template swiperSlide>
          <app-game-card [game]="game" [indexOfElement]="indexOfElement"></app-game-card>
        </ng-template>
      </ng-container>
    </swiper>
    <!-- <div class="games-swiper-navigation-right-{{ categoryId }} mobile-navigation">
      <mat-icon>chevron_right</mat-icon>
    </div> -->
  </div>
</ng-container>
