<ng-container *ngIf="isProvidersPage">
  <div
    #gameGridContainer
    class="game-grid-container"
    [class.hide-autogenerated-rows]="hideAutogeneratedRows"
    [ngStyle]="{ 'grid-template-rows': gridTemplateRows }"
  >
    <ng-container
      *ngFor="let provider of providersList; let indexOfElement = index"
      [ngTemplateOutlet]="providerCard"
      [ngTemplateOutletContext]="{provider}"
    ></ng-container>
  </div>
  <!-- <div class="load-more" *ngIf="!endOfProviders || hasHiddenRows">
    <button mat-button class="load-button" (click)="loadMore()" translate><span translate>show more</span></button>
  </div> -->
</ng-container>

<ng-container *ngIf="!isProvidersPage">
  <div class="games-swiper-top-bar">
    <div class="label-wrapper">
      <span class="label">{{ 'Providers' | translate }}</span>
      <mat-icon class="game-category-icon color" svgIcon="providers"></mat-icon>
    </div>

    <div class="games-swiper-navigation">
      <a class="view-all" [routerLink]="[isLive ? '/games-live' : '/games', 'providers']">{{
        'View all' | translate
      }}</a>
      <mat-icon class="games-swiper-navigation-left-providers">chevron_left</mat-icon>
      <mat-icon class="games-swiper-navigation-right-providers">chevron_right</mat-icon>
    </div>
  </div>
  <div class="swiper-wrapper">
    <div class="games-swiper-navigation-left-providers mobile-navigation" *ngIf="showArrowsMobile">
      <mat-icon>chevron_left</mat-icon>
    </div>
    <swiper [config]="swiperConfig">
      <ng-container *ngFor="let provider of providersList; let indexOfElement = index">
        <ng-template swiperSlide>
          <ng-container [ngTemplateOutlet]="providerCard" [ngTemplateOutletContext]="{provider}"></ng-container>
        </ng-template>
      </ng-container>
    </swiper>
    <div class="games-swiper-navigation-right-providers mobile-navigation" *ngIf="showArrowsMobile">
      <mat-icon>chevron_right</mat-icon>
    </div>
  </div>
</ng-container>

<ng-template #providerCard let-provider="provider">
  <a class="provider-card" [routerLink]="[isLive ? '/games-live' : '/games', 'providers', provider.cleanName]">
    <img [src]="provider.gameProviderUrl | cdnize" [alt]="provider.name" loading="lazy" (error)="onImgError($event)" />
    <div class="game-counter">{{ provider.gamesCount }}</div>
  </a>
</ng-template>
