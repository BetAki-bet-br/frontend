<button [disabled]="disabled() || loading()" [type]="type()" [class]="classes">
  @if (loading()) {
    <span class="app-button-spinner" role="progressbar" aria-label="Carregando"></span>
  } @else {
    <span class="flex items-center gap-2 font-bold">
      <ng-content></ng-content>
    </span>
  }
</button>
