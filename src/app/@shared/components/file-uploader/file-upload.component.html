<div class="flex flex-col justify-start items-center file-uploader-wrapper">
  <div class="flex flex-col justify-center items-center drop-container" appFileUpload (emitItems)="fileUpload($event)">
    <span translate data-qat="text" data-qac="drag-drop-file" translate>
      Drop file here or
      <label [for]="inputId" class="browse-upload" data-qat="link" data-qac="browse"> browse </label>
      {{ fileTypesCsv }}
    </span>
    <!-- Browse input -->
    <input
      #uploadInput
      class="primary-button"
      [id]="inputId"
      type="file"
      [accept]="acceptedFileTypes"
      (change)="onUploadInputChange($event)"
      data-qat="input"
      data-qac="upload-file-input"
      hidden
    />
  </div>
  <!-- Progress bar and status text -->
  <div class="flex flex-col justify-center items-center progress-bar">
    @if (filePresent && isFileLoading) {
      <span data-qat="text" data-qac="file-uploading"> {{ fileName }} {{ 'uploading...' | translate }}</span>
    }
    <!-- <span
      *ngIf="filePresent && !isFileLoading"
      class="flex-row items-center gap-4"
      data-qat="text"
      data-qac="file-uploaded"
      >
      {{ fileName }} {{ 'uploaded' | translate }}
      <mat-icon class="check-mark">check_circle</mat-icon>
    </span> -->
    @if (isFileLoading) {
      <mat-progress-bar mode="determinate" [value]="progress" />
    }
  </div>
</div>
