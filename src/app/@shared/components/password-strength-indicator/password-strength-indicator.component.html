@if (control?.touched || control?.dirty || true) {
<div
  class="password-strength"
  [style.width]="
    'calc(' + ((passwordStrengthIndex ?? 0) * 25).toString() + '% + ' + (customAdditionalWidth ?? 26) + 'px)'
  "
>
  <div [class]="'strength-label ' + strengthLabel">{{ strengthLabel || '' | translate }}</div>
  <div [class]="'strength-progress ' + strengthLabel"></div>
</div>
}
