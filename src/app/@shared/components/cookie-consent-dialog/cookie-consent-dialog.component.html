<app-base-dialog [position]="'bottom-right'" [title]="'This site uses cookies' | translate">
  <ng-container dialogContent>
    <p class="text-center mb-4" translate>
      This website uses cookies to ensure you get the best experience on our website.
    </p>
  </ng-container>

  <ng-container dialogButtons>
    <div class="flex w-full justify-end gap-4">
      <button mat-stroked-button class="button-text-small label-dark flex-grow" (click)="onCancel()">
        <mat-icon fontSet="material-icons-outlined">cancel</mat-icon>
        <span>Recusar</span>
      </button>
      <button mat-button class="button-text-small label-dark flex-grow" (click)="onConfirm()">
        <mat-icon fontSet="material-icons-outlined">check_circle</mat-icon>
        <span>Aceitar</span>
      </button>
    </div>
  </ng-container>
</app-base-dialog>
