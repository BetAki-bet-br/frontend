<div class="bg-surface-auth px-4 p-8 sm:p-12 pb-4 sm:px-30">
  <div class="container mx-auto text-shark-950 max-w-xl xl:max-w-4xl">
    <router-outlet></router-outlet>
    <div class="flex lg:w-1/3 m-auto flex-col mt-4 w-full text-xs sm:text-md text-center gap-y-4">
      <img [src]="ageBadge" alt="Age cap" class="w-16 h-16 m-auto" />

      <span class="font-bold"> Jogue com Responsabilidade!</span>
      <p>
        O jogo deve ser uma forma de entretenimento saudável. Pratique sempre o jogo consciente e fique atento aos
        sinais de comportamento compulsivo.
      </p>
      <button
        class="flex p-2 justify-center items-center m-auto mt-3 gap-x-2 font-bold text-white cursor-pointer rounded-xl bg-brand-500 p-2 transition-opacity duration-200 ease-in-out hover:opacity-80"
        (click)="openSupportChat()"
      >
        <img src="/assets/icons/support-icon.svg" alt="Casino" class="w-6 h-6" />
        Precisa de ajuda?
      </button>
    </div>
  </div>
</div>
