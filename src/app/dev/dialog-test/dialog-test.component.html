<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Dialog Test Triggers</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openFillPlayerInfoDialog()"
    >
      FillPlayerInfoDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openDepositDialog()"
    >
      DepositDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPromotionActionDialog_OptIn_Loading()"
    >
      PromotionActionDialog (Loading)
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPromotionActionDialog_OptIn_Success()"
    >
      PromotionActionDialog (Success)
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPromotionActionDialog_OptIn_Error()"
    >
      PromotionActionDialog (Error)
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openMessageDialog()"
    >
      MessageDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPlayerActivationDialog()"
    >
      PlayerActivationDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPopupMessageDialog()"
    >
      PopupMessageDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openAccessRestrictedDialog()"
    >
      AccessRestrictedDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPlayerInfoDialog()"
    >
      PlayerInfoDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openWithdrawalDialog()"
    >
      WithdrawalDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openPausePeriodDialog()"
    >
      PausePeriodDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openBonusOptInResultDialog()"
    >
      BonusOptInResultDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openAccountClosureDialog()"
    >
      AccountClosureDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openFaceAuthenticatorDialog()"
    >
      FaceAuthenticatorDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openAdblockerDialog()"
    >
      AdblockerDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openAnnualVerificationDialog()"
    >
      AnnualVerificationDialogComponent
    </button>
    <button
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded"
      (click)="openAgeConfirmationDialog()"
    >
      AgeConfirmationDialogComponent
    </button>
  </div>
</div>
