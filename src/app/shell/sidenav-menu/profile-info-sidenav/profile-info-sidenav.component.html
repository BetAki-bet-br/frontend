<div class="flex info-container">
  <div class="profile-info flex gap-3 w-full">
    <div class="profile-icon-container">
      <div class="icon-flex">
        <div class="icon-wrapper">
          <span class="font-icons font-icons--user"></span>
        </div>
      </div>
    </div>
    <div class="flex gap-4 w-full">
      <div class="flex gap-4 items-center">
        <span class="email-span">{{ playerInfo?.eMail }}</span>
      </div>
      <span class="balance-span"
        >{{ balance?.totalBalance | number: '1.2' : dataStoreService.defaultLanguage }} {{ balance?.currency }}</span
      >
    </div>
  </div>

  @if (false) {
    <!-- removed for GLI version -->
    <div class="level-progress flex">
      <div class="flex level-threshold">
        <span
          >Next Level:<span class="level-span">{{ loyaltyPoints?.nextVIPlevel }}</span></span
        >
        <span class="points-value"
          >{{ loyaltyPoints?.vipPointsInPeriod | number: '1.0-0'
          }}<span class="grey-points-value"> / {{ loyaltyPoints?.pointsNeededForNextVIPLevel }} SP</span>
        </span>
      </div>
      <mat-progress-bar mode="determinate" [value]="getVipLevelPercent() | number: '1.2'" />
    </div>
  }

  <div class="deposit-button-container">
    <button mat-button class="deposit-button" routerLink="/profile/wallet/deposit">
      <span translate>WALLET</span>
    </button>
  </div>
</div>
