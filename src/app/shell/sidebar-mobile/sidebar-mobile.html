@if (isOpen()) {
<div class="fixed inset-0 bg-black/50 z-36!" (click)="close()" tabindex="0" role="button"></div>
<div
  class="fixed bottom-0 left-0 right-0 w-full h-full bg-black shadow-2xl z-37 overflow-y-auto pt-(--header-height-mobile) md:pt-(--header-height-desktop) pb-(--mobile-menu-height) text-white!"
  animate.enter="animate-slide-up"
  animate.leave="animate-slide-down"
>
  <div class="relative h-full w-full transition-container">
    <div class="grid gap-[10px] p-3">
      <div class="relative h-[120px] w-full overflow-hidden rounded-lg bg-betaki-500">
        <img ngSrc="assets/liminha.webp" fill alt="Banner Liminha" class="object-cover" priority />
      </div>

      <div class="flex w-full gap-2">
        <button
          class="bg-betaki-darker from-menu-mxain20 to-menu-main0 group flex h-[42px] flex-1 cursor-pointer flex-col flex-wrap items-center justify-center rounded-[8px] hover:bg-gradient-to-r"
          (click)="navigateTo('/')"
          (keyup.enter)="navigateTo('/')"
        >
          <div class="flex items-center justify-center size-[22px]">
            <div id="general/like" class="text-menu-icon size-[22px]" style="display: inline-block">
              <img class="size-full mb-1" ngSrc="/assets/icons/ball-icon.svg" alt="Ao Vivo" width="24" height="24" />
            </div>
          </div></button
        ><button
          class="bg-betaki-darker from-menu-mxain20 to-menu-main0 group flex h-[42px] flex-1 cursor-pointer flex-col flex-wrap items-center justify-center rounded-[8px] hover:bg-gradient-to-r"
          (click)="navigateTo('/games')"
          (keyup.enter)="navigateTo('/games')"
        >
          <div class="flex items-center justify-center size-[22px]">
            <div id="general/collect" class="text-menu-icon size-[22px]" style="display: inline-block">
              <img class="mb-1" ngSrc="/assets/icons/betaki-icon.svg" alt="Ao Vivo" width="211" height="198" />
            </div>
          </div></button
        ><button
          class="bg-betaki-darker from-menu-mxain20 to-menu-main0 group flex h-[42px] flex-1 cursor-pointer flex-col flex-wrap items-center justify-center rounded-[8px] hover:bg-gradient-to-r"
          (click)="navigateTo('/games/live')"
          (keyup.enter)="navigateTo('/games/live')"
        >
          <div class="flex items-center justify-center size-[22px]">
            <div id="general/history" class="text-menu-icon size-[22px]" style="display: inline-block">
              <img class="size-full mb-1" ngSrc="/assets/icons/bet-coin.svg" alt="Ao Vivo" width="24" height="24" />
            </div>
          </div>
        </button>
      </div>

      <div class="flex flex-col items-center gap-[10px] rounded-lg">
        @for (item of menuItems; track $index) { @if ($index === 2) {
        <div class="bg-betaki-500 relative h-[100px] w-full rounded-[8px]">
          <img ngSrc="assets/banner2.png" fill alt="Banner" class="object-cover rounded-[8px]" />
        </div>
        }

        <div
          class="bg-betaki-darker flex h-[40px] w-full items-center justify-between gap-[10px] rounded-[8px] px-[10px] cursor-pointer"
          (click)="item.action ? item.action() : navigateTo(item.routerLink!)"
          (keyup.enter)="item.action ? item.action() : navigateTo(item.routerLink!)"
        >
          <div class="text-general-light flex items-center gap-[10px] text-[14px] font-semibold leading-[22px]">
            <div class="flex items-center justify-center size-[20px]">
              <div class="text-menu-icon size-[20px]" style="display: inline-block">
                @if (item.icon.endsWith('.svg') || item.icon.endsWith('.webp') || item.icon.endsWith('.png')) {
                <img [ngSrc]="item.icon | cdnize" [alt]="item.label" class="size-full" width="24" height="24" />
                } @else {
                <!-- Fallback if needed or SVG content logic -->
                }
              </div>
            </div>
            <span>{{ item.label }}</span>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
}
