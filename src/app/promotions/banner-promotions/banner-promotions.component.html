<div class="page-container h-full">
  <div class="banner-promotions-container">
    <div class="breadcrumbs-wrapper">
      <app-page-breadcrumbs [breadcrumbs]="breadcrumbs" />
    </div>

    <div class="banners-wrapper">
      @for (bannerPromotion of bannerPromotions; track bannerPromotion) {
      <div class="promo-banner" [innerHTML]="bannerPromotion?.templateHtml"></div>
      }
    </div>
  </div>
</div>
