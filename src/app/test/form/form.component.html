    <div>
      <h1>Buttons</h1>
      <h2>Player Portal</h2>
      <section class="flex-col gap-10">
        <div>Basic</div>
        <div>
          <button mat-button>Basic</button>
          <button mat-button disabled>Disabled</button>
          <a mat-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <section class="flex-col gap-10">
        <div>Basic - larger text</div>
        <div>
          <button class="button-larger-text" mat-button>Basic</button>
          <button class="button-larger-text" mat-button disabled>Disabled</button>
          <a class="button-larger-text" mat-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <section class="flex-col gap-10">
        <div>Stroked</div>
        <div>
          <button mat-stroked-button>Basic</button>
          <button mat-stroked-button disabled>Disabled</button>
          <a mat-stroked-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <section class="flex-col gap-10">
        <div>Stroked - larger text</div>
        <div>
          <button class="button-larger-text" mat-stroked-button>Basic</button>
          <button class="button-larger-text" mat-stroked-button disabled>Disabled</button>
          <a class="button-larger-text" mat-stroked-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <section class="flex-col gap-10">
        <div>Nav link button</div>
        <div>
          <button class="nav-link-button" mat-button>Basic</button>
          <button class="nav-link-button active-button" mat-button>Basic Active</button>
          <button class="nav-link-button" mat-button disabled>Disabled</button>
          <a class="nav-link-button" mat-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <section class="flex-col gap-10">
        <div>Nav link button - larger text</div>
        <div>
          <button class="nav-link-button button-larger-text" mat-button>Basic</button>
          <button class="nav-link-button button-larger-text active-button" mat-button>Basic Active</button>
          <button class="nav-link-button button-larger-text" mat-button disabled>Disabled</button>
          <a class="nav-link-button button-larger-text" mat-button href="https://www.google.com/" target="_blank"
            >Link</a
          >
        </div>
      </section>
      <h2>Material</h2>
      <section class="flex-col gap-10">
        <div>Basic</div>
        <div>
          <button mat-button>Basic</button>
          <button mat-button color="primary">Primary</button>
          <button mat-button color="accent">Accent</button>
          <button mat-button color="warn">Warn</button>
          <button mat-button disabled>Disabled</button>
          <a mat-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <mat-divider></mat-divider>
      <section class="flex-col gap-10">
        <div>Raised</div>
        <div>
          <button mat-raised-button>Basic</button>
          <button mat-raised-button color="primary">Primary</button>
          <button mat-raised-button color="accent">Accent</button>
          <button mat-raised-button color="warn">Warn</button>
          <button mat-raised-button disabled>Disabled</button>
          <a mat-raised-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <mat-divider></mat-divider>
      <section>
        <div>Stroked</div>
        <div>
          <button mat-stroked-button>Basic</button>
          <button mat-stroked-button color="primary">Primary</button>
          <button mat-stroked-button color="accent">Accent</button>
          <button mat-stroked-button color="warn">Warn</button>
          <button mat-stroked-button disabled>Disabled</button>
          <a mat-stroked-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <mat-divider></mat-divider>
      <section>
        <div>Flat</div>
        <div>
          <button mat-flat-button>Basic</button>
          <button mat-flat-button color="primary">Primary</button>
          <button mat-flat-button color="accent">Accent</button>
          <button mat-flat-button color="warn">Warn</button>
          <button mat-flat-button disabled>Disabled</button>
          <a mat-flat-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
      </section>
      <mat-divider></mat-divider>
      <section>
        <div>Icon</div>
        <div>
          <div class="example-flex-container">
            <button mat-icon-button aria-label="Example icon button with a vertical three dot icon">
              <mat-icon>more_vert</mat-icon>
            </button>
            <button mat-icon-button color="primary" aria-label="Example icon button with a home icon">
              <mat-icon>home</mat-icon>
            </button>
            <button mat-icon-button color="accent" aria-label="Example icon button with a menu icon">
              <mat-icon>menu</mat-icon>
            </button>
            <button mat-icon-button color="warn" aria-label="Example icon button with a heart icon">
              <mat-icon>favorite</mat-icon>
            </button>
            <button mat-icon-button disabled aria-label="Example icon button with a open in new tab icon">
              <mat-icon>open_in_new</mat-icon>
            </button>
          </div>
        </div>
      </section>
      <mat-divider></mat-divider>
      <section>
        <div>FAB</div>
        <div>
          <div class="flex-row">
            <div class="example-button-container">
              <button mat-fab color="primary" aria-label="Example icon button with a delete icon">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
            <div class="example-button-container">
              <button mat-fab color="accent" aria-label="Example icon button with a bookmark icon">
                <mat-icon>bookmark</mat-icon>
              </button>
            </div>
            <div class="example-button-container">
              <button mat-fab color="warn" aria-label="Example icon button with a home icon">
                <mat-icon>home</mat-icon>
              </button>
            </div>
            <div class="example-button-container">
              <button mat-fab disabled aria-label="Example icon button with a heart icon">
                <mat-icon>favorite</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </section>
      <mat-divider></mat-divider>
      <section>
        <div>Mini FAB</div>
        <div>
          <div class="flex-row">
            <div class="example-button-container">
              <button mat-mini-fab color="primary" aria-label="Example icon button with a menu icon">
                <mat-icon>menu</mat-icon>
              </button>
            </div>
            <div class="example-button-container">
              <button mat-mini-fab color="accent" aria-label="Example icon button with a plus one icon">
                <mat-icon>plus_one</mat-icon>
              </button>
            </div>
            <div class="example-button-container">
              <button mat-mini-fab color="warn" aria-label="Example icon button with a filter list icon">
                <mat-icon>filter_list</mat-icon>
              </button>
            </div>
            <div class="example-button-container">
              <button mat-mini-fab disabled aria-label="Example icon button with a home icon">
                <mat-icon>home</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
