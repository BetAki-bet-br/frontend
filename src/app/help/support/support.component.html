<div class="page-container">
  <div [formGroup]="supportForm" class="flex-col contact-form-container">
    <h1>{{ 'Contact Form' | translate }}</h1>
    <span>{{ 'Please, fill the information below. All fields are required.' | translate }}</span>
    <div class="flex-col mb-12">
      <mat-form-field class="form-input" subscriptSizing="dynamic">
        <input matInput placeholder="Email" formControlName="email" autocomplete="off" />
        <mat-error class="error-msg" *ngIf="supportForm.get('email')?.errors">
          {{ "can't be blank" | translate }}
        </mat-error>
      </mat-form-field>
    </div>

    <div class="flex-col mb-24">
      <mat-form-field appearance="outline" class="textarea-container flex-col form-input">
        <textarea
          matInput
          rows="5"
          cols="50"
          formControlName="message"
          placeholder="Your message"
          autocomplete="off"
          style="resize: none"
        ></textarea>
      </mat-form-field>
      <div class="error-msg" *ngIf="supportForm.get('message')?.errors">
        {{ "can't be blank" | translate }}
      </div>
    </div>

    <div class="flex-col">
      <button mat-button class="send-button button-larger-text" (click)="sendContactFormHandler()">
        {{ 'send message' | translate | uppercase }}
      </button>
    </div>

    <div class="flex-row contact-containter mt-32">
      <a href="mailto:support@comtradegaming.com" class="contact-card flex-row justify-center items-center">
        <div class="contact-icon flex-col justify-center">
          <img src="{{ 'assets/general/icons/contact-headphones-purple.svg' | cdnize }}" alt="support" />
        </div>
        <div class="flex-col">
          <span class="contact-title">{{ 'Support' | translate }}</span>
          <span class="contact-link">help@comtradegaming.com</span>
        </div>
      </a>
      <a href="mailto:complaints@comtradegaming.com" class="contact-card flex-row justify-center items-center">
        <div class="contact-icon flex-col justify-center">
          <img src="{{ 'assets/general/icons/contact-complaints-purple.svg' | cdnize }}" alt="complaints" />
        </div>
        <div class="flex-col">
          <span class="contact-title">{{ 'Complaints' | translate }}</span>
          <span class="contact-link">complaints@comtradegaming.com</span>
        </div>
      </a>
    </div>
  </div>
</div>
