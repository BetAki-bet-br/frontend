<app-game-list [categoryId]="categoryId()" [gameCount]="games().length" title="TOP 10 AO VIVO">
  <div
    appDragScroll
    #scrollableContainer
    class="flex overflow-x-auto overflow-y-visible scroll-smooth select-none no-scrollbar gap-x-16! py-16 -my-12 relative z-0 hover:z-20 ps-3"
  >
    @for (game of games();track $index) {
    <div class="shrink-0 flex items-center relative" [class.ms-14]="$index === 0">
      <app-game-card [class.mr-2]="$index === games().length - 1" [game]="game" (click)="gameClick.emit(game)" />

      <p class="absolute inset-y-0 flex items-center text-5xl text-brand-500! big-number text-white z-10 left-[-60px]">
        {{ $index + 1 }}
      </p>
    </div>
    }
  </div>
</app-game-list>
