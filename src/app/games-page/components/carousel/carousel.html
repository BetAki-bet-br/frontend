<div [class]="'w-full relative ' + class()" [style.max-width]="maxWidth()">
  <div
    class="relative cursor-grab active:cursor-grabbing lg:rounded-lg select-none overflow-hidden aspect-[1920/800]"
    role="region"
    aria-label="Carrossel de imagens"
  >
    @for (slide of slides(); track slide.imageUrl; let i = $index) {
    <div
      class="absolute inset-0 w-full h-full will-change-transform"
      [ngStyle]="slideStyles()[i]"
      [attr.aria-hidden]="i !== currentIndex()"
    >
      <a
        [href]="slide.href"
        [target]="slide.target || '_self'"
        class="block w-full h-full relative"
        [class.pointer-events-none]="hasDragged()"
        [tabindex]="i === currentIndex() ? 0 : -1"
      >
        @if (loading() && !isImageLoaded(i)) {
        <div
          class="absolute inset-0 bg-[#272a31] border rounded-lg border-betaki-500 animate-pulse z-10 flex items-center justify-center"
        >
          <svg
            class="w-10 h-10 text-betaki-400 animate-spin"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </div>
        }
        <img
          [ngSrc]="slide.imageUrl | cdnize"
          [alt]="slide.alt"
          class="w-full h-full object-center object-cover sm:rounded-lg transition-opacity duration-500"
          draggable="false"
          [class.opacity-0]="!isImageLoaded(i)"
          [class.transition-opacity]="true"
          [class.duration-500]="true"
          fill
          [priority]="i === 0"
          (load)="onImageLoad(i)"
        />
      </a>
    </div>
    } @if (slides().length > 1) {
    <div
      class="absolute bottom-0 left-1/2 transform -translate-x-1/2 flex items-center space-x-2 rounded-full z-10 px-3 py-1"
    >
      @for (slide of slides(); track slide.imageUrl; let i = $index) {
      <button
        type="button"
        class="h-3 rounded-full cursor-pointer transition-all duration-300 border-none focus:outline-none focus:ring-2 focus:ring-white"
        [ngStyle]="dotStyles()[i]"
        (click)="goToSlide(i)"
        [attr.aria-label]="'Ir para o slide ' + (i + 1)"
        [attr.aria-current]="i === currentIndex()"
      ></button>
      }
    </div>
    }
  </div>
</div>
