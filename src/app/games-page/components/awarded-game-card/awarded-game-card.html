<div
  class="shrink-0 h-48 w-32 sm:w-[150px] sm:h-56 lg:h-[280px] lg:w-[165px] aspect-[3/4] rounded-lg relative {{
    class()
  }}"
  [ngClass]="{ 'z-50': isHovering() }"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <div
    class="relative flex flex-col h-full w-full overflow-hidden rounded-lg shadow-lg bg-shark-900 group cursor-pointer hover:shadow-xl bg-gradient-awarded p-[5px]"
  >
    <div class="relative flex-grow">
      <div class="absolute inset-0 rounded-lg awarded-gradient">
        <img
          [ngSrc]="gameImageUrl"
          [alt]="game().name"
          draggable="false"
          fill
          class="w-full h-full awarded-img object-cover rounded-lg"
          [priority]="isPriority()"
          (load)="onImageLoad()"
          (error)="imageLoadError.set(true)"
        />
        @if (imageLoadError()) {
        <div class="absolute inset-0 bg-[#272a31] rounded-lg z-10 flex items-center justify-center">
          <img src="assets/icons/logo-white.webp" alt="Logo" class="w-1/2 h-1/2 object-contain" />
        </div>
        }
      </div>

      <div class="absolute top-1 right-1 z-10">
        <span
          class="inline-flex items-center rounded-full text-md sm:text-2xl font-medium bg-[#FFF] border-2 border-[#F64E3B] text-shark-50/80 backdrop-blur-sm"
        >
          🔥
        </span>
      </div>
      <!-- <div class="absolute bottom-1 left-0 right-0 ms-1 py-0 z-10 text-white">
        <h3 class="text-white font-bold md:text-xl line-clamp-2 text-nowrap font-bold">
          {{ game().name }}
        </h3>
      </div> -->
    </div>

    <div class="flex flex-col text-md text-white pt-1 from-brand-500 text-xs font-alt text-nowrap to-black">
      <p class="text-[#B0B4B6]">Já pagou</p>
      <span class="pt-1 md:text-base font-bold">R$ {{ prize() | number: '1.2-2':'pt-BR' }}</span>
    </div>
  </div>

  @if (isHovering()) {
  <div
    class="pop-out-card absolute inset-0 z-50 rounded-lg shadow-2xl flex flex-col overflow-hidden pointer-events-none bg-gradient-awarded p-[5px]"
  >
    <div class="relative flex-grow">
      <div class="absolute inset-0 rounded-lg awarded-gradient">
        <img
          [ngSrc]="gameImageUrl"
          [alt]="game().name"
          draggable="false"
          fill
          class="w-full h-full awarded-img object-cover rounded-lg"
          [priority]="isPriority()"
          (load)="onImageLoad()"
          (error)="imageLoadError.set(true)"
        />
        @if (imageLoadError()) {
        <div class="absolute inset-0 bg-[#272a31] rounded-lg z-10 flex items-center justify-center">
          <img src="assets/icons/logo-white.webp" alt="Logo" class="w-1/2 h-1/2 object-contain" />
        </div>
        }
      </div>

      <div class="absolute top-1 right-1 z-10">
        <span
          class="inline-flex items-center rounded-full text-md sm:text-2xl font-medium bg-[#FFF] border-2 border-[#F64E3B] text-shark-50/80 backdrop-blur-sm"
        >
          🔥
        </span>
      </div>
    </div>

    <div class="flex flex-col text-md text-white pt-1 from-brand-500 text-xs font-alt text-nowrap to-black">
      <p class="text-[#B0B4B6]">Já pagou</p>
      <span class="pt-1 md:text-base font-bold">R$ {{ prize() | number: '1.2-2':'pt-BR' }}</span>
    </div>
  </div>
  }
</div>
