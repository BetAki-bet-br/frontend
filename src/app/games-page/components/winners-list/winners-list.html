<div class="winners-list-container justify-evenly px-3 sm:px-2" [class.loading]="loading()">
  @for (winner of displayedWinners().slice(0,winnersToList()); track winner.id) {
  <div
    class="winner-card-wrapper"
    [class.leaving]="winner.isLeaving"
    (click)="onWinnerClick(winner)"
    (keyup.enter)="onWinnerClick(winner)"
    (keyup.space)="onWinnerClick(winner)"
    tabindex="0"
  >
    <app-winner-card [winner]="winner"></app-winner-card>
  </div>
  }
</div>
