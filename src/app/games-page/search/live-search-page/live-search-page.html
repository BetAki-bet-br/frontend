<div class="container mx-auto p-4">
  <div class="mb-4 flex items-center">
    <div class="relative w-full">
      <input
        type="text"
        placeholder="Pesquise um jogo..."
        class="w-full px-4 py-1 md:py-2 pr-12 border-2 border-accent hover:border-accent-highlight rounded-full text-white transition-colors duration-200 focus:outline-none"
        animate.enter="animate-enter-slide-down"
        animate.leave="animate-leave-slide-up"
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchTermChange($event)"
      />

      <div class="absolute right-4 top-1/2 transform -translate-y-1/2 cursor-pointer">
        <img src="/assets/icons/search-icon.svg" alt="Ícone de busca" class="w-5 h-5 text-light/60 text-accent" />
      </div>
    </div>
    <button (click)="closeSearch()" class="text-white text-3xl leading-none p-2 z-10 cursor-pointer">&times;</button>
  </div>

  @if(searchTerm().length < 3) {
  <h2 class="text-2xl font-bold mb-4 text-white">{{ placeholderCategory()?.name }}</h2>
  }
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-10 gap-4 mt-4">
    @if(searchTerm().length < 3) {
    <div class="col-span-2 row-span-2 relative w-full h-full">
      <img ngSrc="assets/mascote.jpg" alt="Mascote BetAki" priority fill class="rounded-lg object-cover" />
    </div>
    } @for(game of searchResults(); track game.id) {
    <app-game-card
      [layout]="'responsive'"
      [game]="game"
      (click)="handleGameClick(game)"
      (keyup.enter)="handleGameClick(game)"
      (keyup.space)="handleGameClick(game)"
    ></app-game-card>
    }
  </div>
</div>

<app-game-detail-modal
  [game]="selectedGame()!"
  [isOpen]="isGameDetailModalOpen()"
  (closeModal)="closeGameDetails()"
></app-game-detail-modal>
