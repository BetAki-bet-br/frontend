@if (category()) {
<app-game-list
  [categoryId]="category()!.id"
  [gameCount]="category()!.gameMains.length"
  [isExpanded]="true"
  [title]="category()!.name"
>
  <div class="grid grid-cols-2 px-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-10 gap-2 sm:gap-4">
    @for (game of category()!.gameMains.slice(0, visibleGamesCount()); track game.id; let i = $index) {
    <div class="game-card-container" [style.animation-delay.ms]="(i % 12) * 50">
      <app-game-card
        [game]="game"
        [layout]="'responsive'"
        (click)="handleGameClick(game)"
        [scale]="1.5"
      ></app-game-card>
    </div>
    }
  </div>
</app-game-list>

<div class="flex justify-center">
  <div class="border-t border-accent my-4 w-1/3"></div>
</div>

<div class="text-center text-white mt-4 pb-4">
  <p class="mb-4">Exibindo {{ inView() }} de {{ category()!.gameMains.length }}</p>
  @if (visibleGamesCount() < category()!.gameMains.length) {
  <button (click)="loadMoreGames()" class="bg-betaki-500 font-bold py-2 px-6 rounded-lg cursor-pointer">
    Ver Mais
  </button>
  }
</div>

}
<app-game-detail-modal
  [game]="selectedGame()!"
  [isOpen]="!!selectedGame()"
  (closeModal)="closeGameDetails()"
></app-game-detail-modal>
