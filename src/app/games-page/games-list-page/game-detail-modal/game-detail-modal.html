@if (isOpen() && game()) {
<div class="fixed inset-0 bg-black/50 z-40" (click)="onClose()" tabindex="0" role="button"></div>
<div
  class="fixed bottom-0 left-0 right-0 w-full h-2/3 bg-shark-900 rounded-t-3xl shadow-2xl z-50 overflow-hidden mb-[55.5px]"
  animate.enter="animate-slide-up"
  animate.leave="animate-slide-down"
>
  <div
    class="absolute inset-0 bg-cover bg-center"
    [style.background-image]="
      'url(https://pp-assets.icbkiassets.com/cmslibrary/bki/assets/general/gamethumbnails/' +
      game().externalId +
      '.webp)'
    "
  >
    <!-- Gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
  </div>

  <button (click)="onClose()" class="absolute top-4 right-4 text-white text-3xl leading-none p-2 z-10 cursor-pointer">
    &times;
  </button>

  <div class="absolute bottom-0 left-0 right-0 p-5 text-white">
    <h2 class="text-3xl font-bold mb-4">{{ game().name }}</h2>
    <a
      [routerLink]="'/game/' + game().externalId"
      (click)="onClose()"
      class="w-full block bg-betaki-500 font-bold py-3 px-4 rounded-lg text-center text-lg"
    >
      Jogar
    </a>
  </div>
</div>
}
