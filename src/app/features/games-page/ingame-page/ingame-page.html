<div class="game-container flex flex-col w-full h-full bg-[#212529]">
  <div class="iframe-container flex-grow">
    @if(gameUrl(); as url) {
    <iframe
      [src]="url"
      referrerpolicy="origin"
      frameborder="0"
      class="game-iframe w-full h-full"
    ></iframe>
    } @else if (launchError()) {
    <div class="error-prompt text-white">
      <h2>Erro ao carregar</h2>
      <p>{{ launchError() }}</p>
      <a routerLink="/games">Voltar para a lista de jogos</a>
    </div>
    } @else {
    <p>Carregando jogo...</p>
    }
  </div>
</div>
