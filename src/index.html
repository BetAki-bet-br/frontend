<!DOCTYPE html>
<!-- Some change -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- needs to be right at the top to prevent Chrome from reloading favicon on every route change -->
    <link id="fav-icon" rel="icon" type="image/x-icon" href="assetslocal/general/icons/favicon-betaki.png" />
    <title>BetAki | Apostas Regulamentadas, Super Odds e Diversão Garantida</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="A BetAki é uma casa de apostas esportivas regulamentada pelo Governo Federal. Aqui você encontra diversão com futebol, cassino e muito mais. Aposte com segurança e aproveite bônus exclusivos!"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="assetslocal/general/icons/favicon-betaki.png" />

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
      rel="stylesheet"
    />

    <!-- for font assets -->
    <!-- Image is hardcoded to production as we do not have access to "cndize" service here -->
    <link rel="preload" href="/font-icons.ttf" as="font" crossorigin="anonymous" />

    <script>
      /**
       * Script is in the "head" so it is loaded as soon as possible.
       */

      // Variable to hold the JSON data
      let configData;

      function getAssetsUrl() {
        const assetsUrl = `${configData.assetsBaseUrl}/${configData.assetsPath}`;
        return assetsUrl.replace(/([^:])(\/\/+)/g, '$1/');
      }

      // Function to download and parse JSON file
      function loadConfig() {
        fetch('deploy-config.json', {
          // Disable cache for deploy-config
          headers: {
            'Cache-Control': 'no-store,no-cache',
          },
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
          })
          .then((data) => {
            configData = data;
            insertPreloadingDivImageUrl();
            updateHtml();
          })
          .catch((error) => {
            console.error('There was a problem with the fetch operation:', error);
          });
      }

      // Update the links with the assets base url
      function updateHtml() {
        const assetsUrl = getAssetsUrl();

        const logoPlaceholderLink = document.getElementById('logo-placeholder-preload');
        if (logoPlaceholderLink) logoPlaceholderLink.href = `${assetsUrl}/assets/general/logo/betaki-logo.png`;

        const gamePlaceholderLink = document.getElementById('game-placeholder-preload');
        if (gamePlaceholderLink) gamePlaceholderLink.href = `${assetsUrl}/assets/general/logo/game-placeholder.jpg`;
      }

      function insertPreloadingDivImageUrl() {
        const assetsUrl = getAssetsUrl();
        var style = document.createElement('style');
        style.innerHTML = `
          #preloading-div-image {
          background-image: url(${assetsUrl}/assets/general/logo/betaki-logo.png);
          }
        `;
        document.head.appendChild(style);
      }

      loadConfig();
    </script>
  </head>
  <body>
    <!--[if lte IE 11]>
      <p>
        You are using an <strong>outdated</strong> browser. Please
        <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.
      </p>
    <![endif]-->
    <noscript>
      <p>This page requires JavaScript to work properly. Please enable JavaScript in your browser.</p>
    </noscript>
    <div id="preloading-div">
      <div
        id="preloading-div-image"
        style="
          width: 318px;
          height: 144px;
          background-size: contain;
          background-position: center;
          background-repeat: no-repeat;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        "
      ></div>
    </div>
    <app-root></app-root>
  </body>
</html>
