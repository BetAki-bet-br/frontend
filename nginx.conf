
# worker_processes  1;

# events {
#     worker_connections  1024;
# }


# Recommended to set to 'auto' in production to use all available CPU cores.
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance and security enhancements
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off; # Hide nginx version for security

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        # This server block listens on port 80 for HTTP traffic.
        # For a production environment, it is highly recommended to configure SSL/TLS
        # and listen on port 443 (HTTPS).
        #
        # Example for HTTPS:
        # listen 443 ssl http2;
        # listen [::]:443 ssl http2;
        # server_name your_domain.com;
        # ssl_certificate /path/to/your/fullchain.pem;
        # ssl_certificate_key /path/to/your/privkey.pem;
        #
        # And add a redirect for HTTP to HTTPS:
        # server {
        #    listen 80;
        #    server_name your_domain.com;
        #    return 301 https://$host$request_uri;
        # }
        listen       80;

        # Using '_' as the server_name makes this the default server for any hostname.
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Route all Angular routes to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache control for static assets
        location ~* \.(?:css|js|ico|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public";
        }

        # API proxy
        location /api/ {
            # In a production environment, it is recommended to use a variable
            # for the proxy_pass URL to manage different environments easily.
            proxy_pass https://pgapi.betaki.bet.br/;

            proxy_set_header Host pgapi.betaki.bet.br;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Api-Key $http_x_api_key;
            proxy_set_header Authorization $http_authorization;

            # Security: Verifies the SSL certificate of the upstream server.
            # This is the secure default. If the upstream server uses a self-signed
            # certificate or one not in the default trusted store, you must add
            # the CA certificate to a file and use 'proxy_ssl_ca_file'.
            # Disabling this with 'proxy_ssl_verify off;' is insecure and not recommended for production.
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        }
    }
}
