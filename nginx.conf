
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        resolver 8.8.8.8; # Added for DNS resolution in Docker

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass https://pgapi.betaki.bet.br/;
            proxy_set_header Host pgapi.betaki.bet.br;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Api-Key $http_x_api_key; # Pass the API key header
            proxy_set_header Authorization $http_authorization; # Pass the Authorization header

            # Fix for 502 Bad Gateway
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
    }
}
